name: Bug Report
description: Report a bug in create-use-botify, any @use-botify/* package, or the docs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - create-use-botify
        - "@use-botify/core"
        - "@use-botify/router"
        - "@use-botify/tooling"
        - "@use-botify/plugins"
        - "@use-botify/icons"
        - apps/web (Docs & Website)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `pnpm create use-botify my-bot --yes`
        2. Run `pnpm dev`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Windows 11 / macOS / Linux
        - Node.js: v24.x
        - Package manager: pnpm / npm / bun / yarn
        - Package version: 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      render: shell
